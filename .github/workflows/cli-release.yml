name: CLI Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      major_bump: ${{ steps.release.outputs.minor == '0' && steps.release.outputs.patch == '0' }}
    steps:
      # Uses GITHUB_TOKEN, so CI does not run on the release PR by itself.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # npm trusted publishing is tied to this workflow file, so publish stays here.
  cli-release:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      LATEST_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set Secrets
        uses: DevCycleHQ/aws-secrets-action@main
        with:
          secrets_map: '{"MCP_KEY": "DEVCYCLE_GITHUB_cli_MCP_REGISTRY_PKEY"}'
          aws_account_id: "134377926370"

      - name: Get node version
        id: get_node_version
        run: |
          echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.get_node_version.outputs.NVMRC }}"
          registry-url: "https://registry.npmjs.org"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Publish
        uses: ./.github/actions/release
        with:
          upload-url: ${{ needs.release-please.outputs.upload_url }}
          release-tag: ${{ env.LATEST_TAG }}

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json schema
        run: yarn validate:server

      - name: Login to MCP Registry (DNS)
        run: ./mcp-publisher login dns --domain devcycle.com --private-key "${MCP_KEY}"
        env:
          MCP_KEY: ${{ env.MCP_KEY }}

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Update Doc
        uses: ./.github/actions/update-doc
        with:
          latest_tag: $LATEST_TAG
          access_token: ${{ secrets.AUTOMATION_USER_TOKEN }}

      - name: Update VSCode Extension
        if: needs.release-please.outputs.major_bump != 'true'
        uses: ./.github/actions/update-vscode-extension
        with:
          latest_tag: $LATEST_TAG
          access_token: ${{ secrets.AUTOMATION_USER_TOKEN }}

      - name: Update GitHub Actions
        if: needs.release-please.outputs.major_bump != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.AUTOMATION_USER_TOKEN }}
          repository: DevCycleHQ/feature-flag-pr-insights-action
          event-type: update-cli-version
          client-payload: '{"version": "${{ env.LATEST_TAG }}"}'

      - name: Update GitHub Actions (Code Usages)
        if: needs.release-please.outputs.major_bump != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.AUTOMATION_USER_TOKEN }}
          repository: DevCycleHQ/feature-flag-code-usage-action
          event-type: update-cli-version
          client-payload: '{"version": "${{ env.LATEST_TAG }}"}'

      # Move this to release action yml once it works the first time
      - name: Update Homebrew Formula
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.AUTOMATION_USER_TOKEN }}
          repository: DevCycleHQ/homebrew-cli
          event-type: start-deploy
