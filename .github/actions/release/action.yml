name: Publish release
description: Upload release artifacts and publish to NPM

inputs:
  upload-url:
    required: true
    description: 'Upload URL of the GitHub release created by release-please'
  release-tag:
    required: true
    description: 'The tag to use for the release'

runs:
  using: 'composite'
  steps:
    - name: Build Artifacts
      uses: ./.github/actions/build-artifacts
      with:
        upload-url: ${{ inputs.upload-url }}
        release-tag: ${{ inputs.release-tag }}
        
    - name: Set up Node.js for npm publish
      uses: actions/setup-node@v7
      with:
        registry-url: "https://registry.npmjs.org"
        scope: "@devcycle"

    - name: Update npm for OIDC support
      shell: bash
      run: npm install -g npm@11.6.2

    - name: Verify npm version for OIDC
      shell: bash
      run: |
        npm_version=$(npm --version)
        echo "npm version: $npm_version"
        if [ "$(printf '%s\n' "11.6.2" "$npm_version" | sort -V | head -n1)" != "11.6.2" ]; then
          echo "Error: npm version $npm_version is below 11.6.2 required for OIDC trusted publishing"
          exit 1
        fi

    - name: Publish to NPM
      shell: bash
      run: npm publish --access public
