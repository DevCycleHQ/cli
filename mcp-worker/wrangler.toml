# Cloudflare Worker configuration for DevCycle MCP Server
name = "devcycle-mcp-server"
main = "src/index.ts"
compatibility_date = "2026-09-29"
# global_fetch_strictly_public is required by workers-oauth-provider to fetch
# Client ID Metadata Documents without legacy same-zone origin routing (SSRF safety).
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Production environment (explicit section for --env prod)
[env.prod]
name = "devcycle-mcp-server"

[[env.prod.routes]]
pattern = "mcp.devcycle.com/*"
zone_name = "devcycle.com"

[[env.prod.durable_objects.bindings]]
class_name = "DevCycleMCP"
name = "MCP_OBJECT"

[[env.prod.kv_namespaces]]
binding = "OAUTH_KV"
id = "511f2abf74904876ba3e4627154f4d86"

[env.prod.vars]
NODE_ENV = "production"
# RFC 9728 canonical resource identifier. Every access token is bound to this as
# its audience. Kept at the bare origin so it covers both /mcp and the deprecated
# /sse route (the provider requires every apiHandlers key to sit under it).
MCP_RESOURCE_URL = "https://mcp.devcycle.com"
API_BASE_URL = "https://api.devcycle.com"
AUTH0_DOMAIN = "auth.devcycle.com"
AUTH0_AUDIENCE = "https://api.devcycle.com/"
AUTH0_SCOPE = "openid profile email offline_access"
ENABLE_OUTPUT_SCHEMAS = "false"

[env.prod.ai]
binding = "AI"

# Durable Objects configuration
[[migrations]]
new_sqlite_classes = ["DevCycleMCP"]
tag = "v1"

# Observability
[observability]
enabled = true

# Alias unused peer dependencies of agents to stubs
[alias]
"ai" = "./src/stubs/ai.ts"

# Development configuration for local testing
[dev]
port = 8787
# https so the origin wrangler simulates for the configured route matches
# MCP_RESOURCE_URL. Over http the scheme differs, the provider serves no protected
# resource metadata for that origin, and OAuth discovery fails locally.
local_protocol = "https"

# Development environment (separate deployment)
[env.dev]
name = "devcycle-mcp-server-dev"

# Development route
[[env.dev.routes]]
pattern = "mcp-dev.devcycle.com/*"
zone_name = "devcycle.com"

# Development Durable Objects configuration
[[env.dev.durable_objects.bindings]]
class_name = "DevCycleMCP"
name = "MCP_OBJECT"

# Development KV namespace (separate from production)
[[env.dev.kv_namespaces]]
binding = "OAUTH_KV"
id = "511f2abf74904876ba3e4627154f4d86"

# Development environment variables
[env.dev.vars]
NODE_ENV = "development"
MCP_RESOURCE_URL = "https://mcp-dev.devcycle.com"
API_BASE_URL = "https://api.devcycle.com"
AUTH0_DOMAIN = "auth.devcycle.com"
AUTH0_AUDIENCE = "https://api.devcycle.com/"
AUTH0_SCOPE = "openid profile email offline_access"
ENABLE_OUTPUT_SCHEMAS = "false"

# Dev AI binding
[env.dev.ai]
binding = "AI"

# Secrets (set via: wrangler secret put <SECRET_NAME> --env dev/prod)
# AUTH0_CLIENT_ID
# AUTH0_CLIENT_SECRET
# ABLY_API_KEY
